name: Validate prototype

on:
  push:
    branches: [main, "ui-kit-*"]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest

  current-core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.11.1 home-assistant-frontend==20261028.5
      - name: Test isolated current HA Core
        env:
          PYTHONPATH: .
        run: python tests/smoke_current_core.py

  panel-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:kit
      - run: npm run test:panel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/
      - run: node --check custom_components/family_access_manager/frontend/panel.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/build_release.py
      - name: Check committed source checksums
        run: git diff --exit-code -- SHA256SUMS.txt

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    needs: [ha-tests, current-core-smoke, panel-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/build_release.py
      - name: Publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/family_access_manager/manifest.json"))["version"])')
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
          else
            gh release create "v$version" dist/*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Family Access Manager $version – HA UI Kit 1.2.1" --notes-file docs/RELEASE_0.2.0.md
          fi

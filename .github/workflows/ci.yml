name: Validate Family Access Manager

on:
  push:
    branches: [main, "ui-kit-*", "feature/*"]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest

  vacation-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: v9h45n47mh-lab/light-manager
          ref: 076c6893ccf8f2c14dc2f58369c3b01dd69135d0
          path: .test-deps/light-manager
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: v9h45n47mh-lab/shutter-manager
          ref: cec20718f8c67d3b868c1ee0458a1ac24abaef2d
          path: .test-deps/shutter-manager
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: v9h45n47mh-lab/hausarbeiten-manager
          ref: c8f69fec6b4d44656ee32cf2d4dd8c8fad8c43ae
          path: .test-deps/hausarbeiten-manager
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - name: Verify actual vacation consumers against HA
        env:
          VACATION_CONSUMER_ROOT: ${{ github.workspace }}/.test-deps
        run: python -m pytest tests/test_vacation.py tests/test_vacation_consumers.py

  current-core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.11.1 home-assistant-frontend==20261028.5
      - name: Test isolated current HA Core
        env:
          PYTHONPATH: .
        run: python tests/smoke_current_core.py

  panel-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:kit
      - run: npm run test:panel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/
      - run: node --check custom_components/family_access_manager/frontend/panel.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/build_release.py
      - name: Check committed source checksums
        run: git diff --exit-code -- SHA256SUMS.txt

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    needs: [ha-tests, vacation-integration, current-core-smoke, panel-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/build_release.py
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/family_access_manager/manifest.json"))["version"])')
          release_flags=(--prerelease --latest=false)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags=(--latest)
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
          else
            gh release create "v$version" dist/*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" "${release_flags[@]}" --title "Family Access Manager $version" --notes-file "docs/RELEASE_$version.md"
          fi
